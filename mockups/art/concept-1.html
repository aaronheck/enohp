<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yelnats art concept 1: Letter Swap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3a2d;--raised:#15493a;--deep:#0a2a20;--cream:#fff4dc;--ink:#14241d;--butter:#ffd84d;--muted:rgba(255,244,220,.66)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Bricolage Grotesque',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,p{margin:0}
.screen{height:100vh;max-width:480px;margin:0 auto;padding:20px 24px 24px;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--muted);min-height:32px}
.title{font-weight:800;font-size:clamp(40px,12vw,58px);line-height:.92;letter-spacing:-.035em;margin-top:28px}
.accent{color:var(--butter)}
.lede{font-size:17px;line-height:1.4;font-weight:500;color:var(--muted);margin-top:16px;max-width:320px}
.home-art{position:relative;flex:1 1 0;min-height:120px;max-height:340px;margin:16px 0 20px}
.home-art svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.stack>*+*{margin-top:12px}.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;padding:16px 20px;border:0;border-radius:20px;font:800 19px 'Bricolage Grotesque',system-ui,sans-serif}
.btn-primary{background:var(--butter);color:var(--ink);box-shadow:0 4px 0 #c9a52a}
.btn-ghost{background:var(--raised);color:var(--cream);box-shadow:0 4px 0 var(--deep)}
</style></head>
<body><!-- Concept 1: Letter Swap. STANLEY flips into YELNATS, tile by tile. -->
<div class="screen">
  <div class="topbar"><span>yelnats</span></div>
  <h1 class="title">Say it<br><span class="accent">backwards.</span></h1>
  <p class="lede">Telephone, but backwards. We rewind your recording, your friend guesses what you said, then says <b class="accent">their</b> guess backwards for the next person.</p>
  <div class="home-art">
<svg viewBox="0 0 340 260" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" font-family="'Bricolage Grotesque', system-ui, sans-serif">
<defs><clipPath id="vb"><rect x="0" y="0" width="340" height="260"/></clipPath></defs>
<g clip-path="url(#vb)">
<path d="M38.0,82 C38.0,140 302.0,116 302.0,166" fill="none" stroke="#ff5b3a" stroke-width="5" stroke-linecap="round"/>

<circle cx="170" cy="127.0" r="24" fill="#0a2a20"/>
<path d="M168,117.0 L156,127.0 L168,137.0 Z M182,117.0 L170,127.0 L182,137.0 Z" fill="#ffd84d" stroke="#ffd84d" stroke-width="3" stroke-linejoin="round"/>
<g transform="rotate(0 38.0 49.0)"><rect x="19.0" y="30" width="38" height="46" rx="9" fill="#cdbf9f"/><rect x="19.0" y="26" width="38" height="46" rx="9" fill="#fff4dc"/><text x="38.0" y="59.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">S</text></g>
<g transform="rotate(0 82.0 49.0)"><rect x="63.0" y="30" width="38" height="46" rx="9" fill="#cdbf9f"/><rect x="63.0" y="26" width="38" height="46" rx="9" fill="#fff4dc"/><text x="82.0" y="59.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">T</text></g>
<g transform="rotate(0 126.0 49.0)"><rect x="107.0" y="30" width="38" height="46" rx="9" fill="#cdbf9f"/><rect x="107.0" y="26" width="38" height="46" rx="9" fill="#fff4dc"/><text x="126.0" y="59.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">A</text></g>
<g transform="rotate(0 170.0 49.0)"><rect x="151.0" y="30" width="38" height="46" rx="9" fill="#cdbf9f"/><rect x="151.0" y="26" width="38" height="46" rx="9" fill="#fff4dc"/><text x="170.0" y="59.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">N</text></g>
<g transform="rotate(0 214.0 49.0)"><rect x="195.0" y="30" width="38" height="46" rx="9" fill="#cdbf9f"/><rect x="195.0" y="26" width="38" height="46" rx="9" fill="#fff4dc"/><text x="214.0" y="59.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">L</text></g>
<g transform="rotate(0 258.0 49.0)"><rect x="239.0" y="30" width="38" height="46" rx="9" fill="#cdbf9f"/><rect x="239.0" y="26" width="38" height="46" rx="9" fill="#fff4dc"/><text x="258.0" y="59.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">E</text></g>
<g transform="rotate(0 302.0 49.0)"><rect x="283.0" y="30" width="38" height="46" rx="9" fill="#cdbf9f"/><rect x="283.0" y="26" width="38" height="46" rx="9" fill="#fff4dc"/><text x="302.0" y="59.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">Y</text></g>
<g transform="rotate(-5 38.0 201.0)"><rect x="19.0" y="182" width="38" height="46" rx="9" fill="#5fa9d6"/><rect x="19.0" y="178" width="38" height="46" rx="9" fill="#8fd3ff"/><text x="38.0" y="211.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">Y</text></g>
<g transform="rotate(3 82.0 201.0)"><rect x="63.0" y="182" width="38" height="46" rx="9" fill="#c9a52a"/><rect x="63.0" y="178" width="38" height="46" rx="9" fill="#ffd84d"/><text x="82.0" y="211.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">E</text></g>
<g transform="rotate(-2 126.0 201.0)"><rect x="107.0" y="182" width="38" height="46" rx="9" fill="#c9a52a"/><rect x="107.0" y="178" width="38" height="46" rx="9" fill="#ffd84d"/><text x="126.0" y="211.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">L</text></g>
<g transform="rotate(4 170.0 201.0)"><rect x="151.0" y="182" width="38" height="46" rx="9" fill="#c9a52a"/><rect x="151.0" y="178" width="38" height="46" rx="9" fill="#ffd84d"/><text x="170.0" y="211.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">N</text></g>
<g transform="rotate(-3 214.0 201.0)"><rect x="195.0" y="182" width="38" height="46" rx="9" fill="#c9a52a"/><rect x="195.0" y="178" width="38" height="46" rx="9" fill="#ffd84d"/><text x="214.0" y="211.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">A</text></g>
<g transform="rotate(2 258.0 201.0)"><rect x="239.0" y="182" width="38" height="46" rx="9" fill="#c9a52a"/><rect x="239.0" y="178" width="38" height="46" rx="9" fill="#ffd84d"/><text x="258.0" y="211.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">T</text></g>
<g transform="rotate(5 302.0 201.0)"><rect x="283.0" y="182" width="38" height="46" rx="9" fill="#c9442a"/><rect x="283.0" y="178" width="38" height="46" rx="9" fill="#ff5b3a"/><text x="302.0" y="211.0" text-anchor="middle" font-size="29" font-weight="800" fill="#14241d">S</text></g>
</g></svg>
  </div>
  <div class="stack">
    <button class="btn btn-primary">Start a chain</button>
    <div class="row"><button class="btn btn-ghost">How to play</button><button class="btn btn-ghost">My chains</button></div>
  </div>
</div>
</body></html>
