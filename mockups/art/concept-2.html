<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yelnats art concept 2: Whisper Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3a2d;--raised:#15493a;--deep:#0a2a20;--cream:#fff4dc;--ink:#14241d;--butter:#ffd84d;--muted:rgba(255,244,220,.66)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Bricolage Grotesque',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,p{margin:0}
.screen{height:100vh;max-width:480px;margin:0 auto;padding:20px 24px 24px;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--muted);min-height:32px}
.title{font-weight:800;font-size:clamp(40px,12vw,58px);line-height:.92;letter-spacing:-.035em;margin-top:28px}
.accent{color:var(--butter)}
.lede{font-size:17px;line-height:1.4;font-weight:500;color:var(--muted);margin-top:16px;max-width:320px}
.home-art{position:relative;flex:1 1 0;min-height:120px;max-height:340px;margin:16px 0 20px}
.home-art svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.stack>*+*{margin-top:12px}.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;padding:16px 20px;border:0;border-radius:20px;font:800 19px 'Bricolage Grotesque',system-ui,sans-serif}
.btn-primary{background:var(--butter);color:var(--ink);box-shadow:0 4px 0 #c9a52a}
.btn-ghost{background:var(--raised);color:var(--cream);box-shadow:0 4px 0 var(--deep)}
</style></head>
<body><!-- Concept 2: Whisper Line. Three party guests pass a word down the line and it drifts. -->
<div class="screen">
  <div class="topbar"><span>yelnats</span></div>
  <h1 class="title">Say it<br><span class="accent">backwards.</span></h1>
  <p class="lede">Telephone, but backwards. We rewind your recording, your friend guesses what you said, then says <b class="accent">their</b> guess backwards for the next person.</p>
  <div class="home-art">
<svg viewBox="0 0 340 260" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" font-family="'Bricolage Grotesque', system-ui, sans-serif">
<defs><clipPath id="vb"><rect x="0" y="0" width="340" height="260"/></clipPath></defs>
<g clip-path="url(#vb)">
<ellipse cx="70.5" cy="249" rx="45.88" ry="7" fill="#0a2a20"/>
<g transform="rotate(7 60 248)">
<rect x="23.0" y="124" width="74" height="124" rx="37.0" fill="#ff5b3a"/>
<circle cx="85" cy="171" r="6" fill="#ffb3c7" opacity=".55"/>
<circle cx="57" cy="158" r="4.5" fill="#14241d"/><circle cx="75" cy="158" r="4.5" fill="#14241d"/>
<ellipse cx="68" cy="177" rx="7" ry="8" fill="#14241d"/>
<ellipse cx="68" cy="181" rx="4.5" ry="3" fill="#ffb3c7"/>
</g>
<ellipse cx="181.0" cy="249" rx="45.88" ry="7" fill="#0a2a20"/>
<g transform="rotate(6 172 248)">
<rect x="135.0" y="146" width="74" height="102" rx="37.0" fill="#8fd3ff"/>
<circle cx="197" cy="193" r="6" fill="#ffb3c7" opacity=".55"/>
<circle cx="169" cy="180" r="4.5" fill="#14241d"/><circle cx="187" cy="180" r="4.5" fill="#14241d"/>
<ellipse cx="180" cy="199" rx="7" ry="8" fill="#14241d"/>
<ellipse cx="180" cy="203" rx="4.5" ry="3" fill="#ffb3c7"/>
</g>
<ellipse cx="276.0" cy="249" rx="45.88" ry="7" fill="#0a2a20"/>
<g transform="rotate(-4 282 248)">
<rect x="245.0" y="132" width="74" height="116" rx="37.0" fill="#c9a7ff"/>

<circle cx="271" cy="164" r="4.5" fill="#14241d"/><circle cx="290" cy="166" r="6" fill="#14241d"/>
<path d="M264,153 L276,151" stroke="#14241d" stroke-width="3.5" stroke-linecap="round"/>
<path d="M273,186 q4,-5 8,0 t8,0 t8,0" fill="none" stroke="#14241d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<path d="M61,74 L83,92 L79,74 Z" fill="#fff4dc"/><rect x="6" y="34" width="122" height="42" rx="21.0" fill="#fff4dc"/><text x="67.0" y="60.78" text-anchor="middle" font-size="17" font-weight="800" fill="#14241d" letter-spacing="-0.3">pickle jar</text>
<path d="M169,122 L191,140 L187,122 Z" fill="#fff4dc"/><rect x="116" y="82" width="116" height="42" rx="21.0" fill="#fff4dc"/><text x="174.0" y="108.78" text-anchor="middle" font-size="17" font-weight="800" fill="#14241d" letter-spacing="-0.3">tickle car</text>
<path d="M265,58 L267,76 L283,58 Z" fill="#ffd84d"/><rect x="214" y="18" width="122" height="42" rx="21.0" fill="#ffd84d"/><text x="275.0" y="44.78" text-anchor="middle" font-size="17" font-weight="800" fill="#14241d" letter-spacing="-0.3">nick’s cage?</text>
</g></svg>
  </div>
  <div class="stack">
    <button class="btn btn-primary">Start a chain</button>
    <div class="row"><button class="btn btn-ghost">How to play</button><button class="btn btn-ghost">My chains</button></div>
  </div>
</div>
</body></html>
