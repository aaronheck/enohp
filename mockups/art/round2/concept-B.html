<!doctype html>

<title>Yelnats art round 2, concept B: Switchback Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3a2d;--raised:#15493a;--deep:#0a2a20;--cream:#fff4dc;--ink:#14241d;--butter:#ffd84d;--muted:rgba(255,244,220,.66)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Bricolage Grotesque',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,p{margin:0}
.screen{height:100vh;max-width:480px;margin:0 auto;padding:20px 24px 24px;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--muted);min-height:32px}
.title{font-weight:800;font-size:clamp(40px,12vw,58px);line-height:.92;letter-spacing:-.035em;margin-top:28px}
.accent{color:var(--butter)}
.lede{font-size:17px;line-height:1.4;font-weight:500;color:var(--muted);margin-top:16px;max-width:320px}
/* art box: same flexible box as production; container query swaps in the compact strip on short screens */
.home-art{position:relative;flex:1 1 0;min-height:120px;max-height:340px;margin:16px 0 20px;container-type:size}
.home-art svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.home-art .art-compact{display:none}
@container (max-height: 200px){.home-art .art-full{display:none}.home-art .art-compact{display:block}}
.stack>*+*{margin-top:12px}.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;padding:16px 20px;border:0;border-radius:20px;font:800 19px 'Bricolage Grotesque',system-ui,sans-serif}
.btn-primary{background:var(--butter);color:var(--ink);box-shadow:0 4px 0 #c9a52a}
.btn-ghost{background:var(--raised);color:var(--cream);box-shadow:0 4px 0 var(--deep)}
</style></head>
